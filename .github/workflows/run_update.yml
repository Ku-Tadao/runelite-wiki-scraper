name: Do update

on:
  schedule:
    - cron: '21 0 * * fri'
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if row counts dropped (for intentional data cuts)
        type: boolean
        default: false
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 11
    - uses: gradle/actions/setup-gradle@v6
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pipenv
        pipenv install
    - name: Scrape wiki
      run: |
        pipenv run python test_parse_tiles.py
        pipenv run python main.py
    - name: Run h2-importer
      run: |
        pushd h2-importer
          ./gradlew run --args="../output ../output/data.sqlite"
        popd
    - name: Export JSON for the plugin
      run: python export_json.py output/data.sqlite output/data.json.gz
    - name: Generate checksums
      run: |
        sha256sum ./output/data.sqlite | cut -d " " -f 1 > ./output/data.sqlite.sha256
        sha256sum ./output/data.json.gz | cut -d " " -f 1 > ./output/data.json.gz.sha256
    - name: Publish to wiki-data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git worktree add ../data origin/wiki-data
        [ "${{ inputs.force }}" = true ] || python check_output.py ../data/output/data.sqlite output/data.sqlite
        rm -rf ../data/output
        cp -r output ../data/output
        cd ../data
        git add -A output
        git diff --cached --quiet && exit 0
        git commit -m "Wiki scrape data $(date +'%Y-%m-%d')"
        git push origin HEAD:wiki-data
