name: Do update

on:
  schedule:
    - cron: '21 0 * * fri'
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
    - uses: gradle/actions/setup-gradle@v4
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pipenv
        pipenv install
    - name: Scrape wiki
      run: |
        pipenv run python main.py
    - name: Run h2-importer
      run: |
        pushd h2-importer
          ./gradlew run --args="../output ../output/data.sqlite"
        popd
    - name: Generate H2 checksum
      run: |
        sha256sum ./output/data.sqlite | cut -d " " -f 1 > ./output/data.sqlite.sha256
    - name: Publish to wiki-data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git worktree add ../data origin/wiki-data
        rm -rf ../data/output
        cp -r output ../data/output
        cd ../data
        git add -A output
        git diff --cached --quiet && exit 0
        git commit -m "Wiki scrape data $(date +'%Y-%m-%d')"
        git push origin HEAD:wiki-data
